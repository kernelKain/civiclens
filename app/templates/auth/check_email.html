{% extends "base.html" %}

{% block title %}Check your email · CivicLens{% endblock %}

{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-7 col-lg-5">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 text-center">
          <i
            class="bi bi-envelope-check display-4 text-primary"
            aria-hidden="true"
          ></i>

          <h1 class="h3 mt-3">Check your email</h1>

          <p class="text-secondary">
            If the address can be registered, CivicLens has sent
            an account-confirmation link.
          </p>

          <a class="btn btn-outline-primary" href="/auth/sign-in">
            Return to sign in
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
