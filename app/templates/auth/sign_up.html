{% extends "base.html" %}

{% block title %}Create account · CivicLens{% endblock %}

{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-7 col-lg-5">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3 mb-2">Create your CivicLens account</h1>
          <p class="text-secondary mb-4">
            Join your community and follow civic issues.
          </p>

          {% if error %}
          <div class="alert alert-danger" role="alert">
            {{ error }}
          </div>
          {% endif %}

          <form method="post" action="/auth/sign-up">
            <input
              type="hidden"
              name="csrf_token"
              value="{{ csrf_token }}"
            >

            <div class="mb-3">
              <label class="form-label" for="display_name">
                Display name
              </label>
              <input
                class="form-control"
                id="display_name"
                name="display_name"
                value="{{ display_name }}"
                autocomplete="name"
                maxlength="80"
                required
              >
            </div>

            <div class="mb-3">
              <label class="form-label" for="email">
                Email
              </label>
              <input
                class="form-control"
                id="email"
                name="email"
                type="email"
                value="{{ email }}"
                autocomplete="email"
                required
              >
            </div>

            <div class="mb-4">
              <label class="form-label" for="password">
                Password
              </label>
              <input
                class="form-control"
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
              >
              <div class="form-text">
                Use at least eight characters.
              </div>
            </div>

            <button class="btn btn-primary w-100" type="submit">
              Create account
            </button>
          </form>

          <p class="text-center mt-4 mb-0">
            Already registered?
            <a href="/auth/sign-in">Sign in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
